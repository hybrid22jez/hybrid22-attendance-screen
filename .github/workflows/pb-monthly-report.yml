name: PB Board Monthly Report

on:
  schedule:
    # 6am Melbourne time (UTC+10) — same DST caveat as your other crons
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send now regardless of date (for testing)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: pb-monthly-report
        run: npm install googleapis nodemailer

      - name: Run monthly report check
        working-directory: pb-monthly-report
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORCE_SEND: ${{ inputs.force_send }}
        run: node build.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pb-monthly-report/state.json
          git diff --staged --quiet || git commit -m "Update PB monthly report state"
          git push
