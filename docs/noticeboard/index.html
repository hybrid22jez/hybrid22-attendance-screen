<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid 22 — Noticeboard</title>
<style>
  body{
    margin:0;
    background:#141414;
    color:#FAF9F6;
    font-family:'Helvetica Neue', Arial, sans-serif;
    padding:32px 24px;
  }
  h1{
    font-size:22px;
    letter-spacing:0.02em;
    color:#C23B22;
    margin:0 0 28px;
  }
  .notice{
    border-bottom:1px solid #333;
    padding:20px 0;
  }
  .notice:last-child{border-bottom:none;}
  .notice h2{
    font-size:28px;
    margin:0 0 6px;
  }
  .notice p{
    font-size:19px;
    color:#D8D5CC;
    margin:0;
    line-height:1.4;
  }
  .empty{
    font-size:20px;
    color:#9A968C;
    padding:20px 0;
  }
</style>
</head>
<body>
  <h1>Hybrid 22 — This Week</h1>
  <div class="empty">Nothing new this week — full send in class.</div>
</body>
</html>
