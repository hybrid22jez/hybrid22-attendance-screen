<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hybrid 22 · Attendance Milestones</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&display=swap">
<style>
  /* TV display, designed at 1920x1080. Everything is sized in rem and the
     root font size scales with the screen width, so the layout looks the
     same on a 1080p or 4K TV (16px at 1920 wide). */
  :root {
    /* Progress Pink - the Hybrid 22 brand accent (same value as the KPI dashboard). */
    --pink: #FF9BD9;
    --bg: #000000;
    --card: #111111;
    --line: #232323;
    --text: #F4F1E9;
    --muted: #9A968E;
    --dim: #5E5B56;
    --chip: #262626;
    font-size: calc(100vw / 120);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  .screen {
    height: 100vh;
    padding: 2.5rem;
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 2rem;
  }
  .card {
    background: var(--card);
    border-radius: 1.5rem;
    padding: 2.25rem 2.5rem 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 1.25rem;
    border-bottom: 2px solid var(--line);
  }
  .card-title {
    font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 3.25rem;
    line-height: 1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0;
  }
  .card-title .accent { color: var(--pink); }
    .card-meta {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* List viewport: fills the rest of the card. If the rows don't fit, the
     list is doubled and scrolls up on a loop. */
  /* Side padding leaves room for the pink ring on major milestone avatars. */
  .list { flex: 1; min-height: 0; overflow: hidden; position: relative; margin: 0 -0.75rem; padding: 0 0.75rem; }
  .list.scrolling::before, .list.scrolling::after {
    content: ''; position: absolute; left: 0; right: 0; height: 3rem; z-index: 2; pointer-events: none;
  }
  .list.scrolling::before { top: 0; background: linear-gradient(var(--card), transparent); }
  .list.scrolling::after { bottom: 0; background: linear-gradient(transparent, var(--card)); }
  .track { will-change: transform; }
  .list.scrolling .track { animation: scrollV linear infinite; }
  @keyframes scrollV { from { transform: translateY(0); } to { transform: translateY(-50%); } }

  .row {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--line);
  }
  .avatar {
    width: 5.25rem; height: 5.25rem; flex-shrink: 0;
    border-radius: 50%;
    background: var(--chip);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 2rem; color: #CFCAC0;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .row.major .avatar { box-shadow: 0 0 0 0.25rem var(--card), 0 0 0 0.45rem var(--pink); }
  .who { flex: 1; min-width: 0; }
  .name {
    margin: 0;
    font-weight: 600;
    font-size: 2.25rem;
    line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .detail {
    margin: 0.25rem 0 0;
    font-size: 1.4rem;
    color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .detail .badge { color: var(--text); opacity: 0.85; }
  .row.major .detail .badge { color: var(--pink); opacity: 1; }
  .when { color: var(--dim); }

  .count { text-align: right; flex-shrink: 0; }
  .count .num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 4.25rem;
    line-height: 0.9;
  }
  .row.major .count .num { color: var(--pink); }
  .count .unit {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Almost There rows */
  .togo {
    width: 5.25rem; height: 5.25rem; flex-shrink: 0;
    border-radius: 50%;
    border: 0.2rem solid var(--pink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1;
  }
  .togo .n { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 2.5rem; }
  .togo .l { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.15rem; }
  .almost .name { font-size: 2rem; }

  .empty {
    color: var(--muted);
    font-size: 1.75rem;
    padding: 2.5rem 0;
  }

  /* Small freshness stamp for staff - easy to check if the screen has
     stopped updating, without a header on screen. */
  .stamp {
    position: fixed; right: 1.25rem; bottom: 0.6rem;
    font-size: 0.85rem; color: #3A3835; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="screen">
  <section class="card">
    <div class="card-head">
      <h1 class="card-title">This Week's <span class="accent">Milestones</span></h1>
      <span class="card-meta" id="week-count"></span>
    </div>
    <div class="list" id="week-list"><div class="track"></div></div>
  </section>

  <section class="card almost">
    <div class="card-head">
      <h2 class="card-title"><span class="accent">Almost</span> There</h2>
    </div>
    <div class="list" id="almost-list"><div class="track"></div></div>
  </section>
</div>
<div class="stamp" id="stamp"></div>

<script>
  const DATA_URL = 'milestone-screen-data.json';
  // Roughly how long each person stays readable before the next one
  // scrolls in. Loop duration scales with the list length so long lists
  // don't fly past.
  const SECONDS_PER_ITEM = 3;
  const DATA_REFRESH_MS = 30 * 60 * 1000;   // refetch data every 30 min
  const PAGE_RELOAD_MS = 6 * 60 * 60 * 1000; // pick up page changes every 6 hrs

  // Names and links come from the data file; escape them so nothing in a
  // member's profile can inject markup onto the screen.
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function initials(name) {
    return (name || '').split(' ').filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase();
  }

  function avatarHtml(item) {
    const fallback = esc(initials(item.name));
    if (item.photoUrl) {
      return `<div class="avatar"><img src="${esc(item.photoUrl)}" alt="" onerror="this.parentNode.textContent='${fallback}'"></div>`;
    }
    return `<div class="avatar">${fallback}</div>`;
  }

  // Melbourne calendar date, so "Today" flips at local midnight.
  function melbDate(d) {
    return d.toLocaleDateString('en-CA', { timeZone: 'Australia/Melbourne' });
  }

  function whenLabel(dateStr) {
    if (!dateStr) return '';
    const now = new Date();
    const today = melbDate(now);
    const yesterday = melbDate(new Date(now.getTime() - 86400000));
    if (dateStr === today) return 'Today';
    if (dateStr === yesterday) return 'Yesterday';
    const d = new Date(`${dateStr}T12:00:00+11:00`);
    return d.toLocaleDateString('en-AU', { weekday: 'long', timeZone: 'Australia/Melbourne' });
  }

  function milestoneRow(item) {
    const when = whenLabel(item.date);
    return `
      <div class="row${item.major ? ' major' : ''}">
        ${avatarHtml(item)}
        <div class="who">
          <p class="name">${esc(item.name)}</p>
          <p class="detail"><span class="badge">${esc(item.badgeName)}</span>${when ? ` <span class="when">· ${esc(when)}</span>` : ''}</p>
        </div>
        <div class="count"><span class="num">${esc(item.milestone)}</span><span class="unit">Classes</span></div>
      </div>`;
  }

  function almostRow(item) {
    const n = Number(item.classesToGo) || 0;
    return `
      <div class="row">
        <div class="togo"><span class="n">${n}</span><span class="l">to go</span></div>
        <div class="who">
          <p class="name">${esc(item.name)}</p>
          <p class="detail">Class ${esc(item.nextMilestone)} unlocks <span class="badge">${esc(item.badgeName)}</span></p>
        </div>
      </div>`;
  }

  // Render rows, then only scroll if they don't fit the space available.
  function renderList(id, items, rowFn, emptyText) {
    const list = document.getElementById(id);
    const track = list.querySelector('.track');
    list.classList.remove('scrolling');
    track.style.animationDuration = '';

    if (!items.length) {
      track.innerHTML = `<p class="empty">${emptyText}</p>`;
      return;
    }
    const html = items.map(rowFn).join('');
    track.innerHTML = html;
    if (track.scrollHeight > list.clientHeight) {
      track.innerHTML = html + html;
      track.style.animationDuration = `${items.length * SECONDS_PER_ITEM}s`;
      list.classList.add('scrolling');
    }
  }

  let lastData = null;

  function render(data) {
    // Major and regular level ups share the same rolling 7 day window, so
    // they're shown as one list: newest first, bigger milestone first on
    // the same day.
    const week = [...(data.majorMilestones || []), ...(data.everyLevelUp || [])]
      .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.milestone - a.milestone);

    document.getElementById('week-count').textContent =
      week.length ? `${week.length} level up${week.length === 1 ? '' : 's'}` : '';
    renderList('week-list', week, milestoneRow, 'No milestones yet this week. Who\'s next?');
    renderList('almost-list', data.almostThere || [], almostRow, 'Nobody close right now.');
    document.getElementById('stamp').textContent = `Updated ${data.generatedAt || ''}`;
  }

  async function load() {
    try {
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      lastData = await res.json();
      render(lastData);
    } catch (err) {
      // Keep showing the last good data (if any) instead of a broken screen.
      console.error('Failed to load milestone screen data:', err);
      if (!lastData) document.getElementById('stamp').textContent = 'Waiting for data…';
    }
  }

  load();
  setInterval(load, DATA_REFRESH_MS);
  window.addEventListener('resize', () => lastData && render(lastData));

  // Reload the page now and then so design changes reach the TV, but only
  // after checking the site is reachable. A full reload during a wifi drop
  // would leave the TV stuck on a browser error page.
  setInterval(async () => {
    try {
      const res = await fetch(`${location.pathname}?t=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
      if (res.ok) location.reload();
    } catch (_) { /* offline - try again next time */ }
  }, PAGE_RELOAD_MS);
</script>
</body>
</html>
