name: Build Noticeboard

on:
  schedule:
    # 5am Melbourne time (UTC+10, adjust to 19:00 UTC in AEDT months)
    - cron: '0 19 * * *'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: noticeboard
        run: npm install googleapis

      - name: Build noticeboard page
        working-directory: noticeboard
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: node build.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/noticeboard/index.html
          git diff --staged --quiet || git commit -m "Update noticeboard"
          git push
